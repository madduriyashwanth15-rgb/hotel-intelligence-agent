[project]
name = "hotel-intelligence-agent"
version = "0.1.0"
description = "AI copilot for hotel teams (Phase 1: foundations and synthetic data)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "fastembed>=0.8,<0.9",
    "langgraph>=1.2,<2",
    "mcp>=1.30,<2",
    "pgvector>=0.5,<0.6",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0",
    "sqlglot>=30.21,<31",
    "uvicorn>=0.54.0",
]

[project.scripts]
hotel-seed = "hotel_agent.synthetic.seed:main"
hotel-kb = "hotel_agent.knowledge.cli:main"
hotel-sql = "hotel_agent.sql.cli:main"
hotel-mcp = "hotel_agent.ops.mcp_server:main"
hotel-ops = "hotel_agent.ops.cli:main"
hotel-agent = "hotel_agent.agent.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hotel_agent"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "S", "RUF", "PT"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests use assert by design; synthetic generator uses non-crypto random by design.
# Tests assert, use fake secrets and deliberately build (often malicious) SQL strings.
"tests/**" = ["S101", "S105", "S106", "S608"]
"src/hotel_agent/synthetic/**" = ["S311"]
# Autogenerated migrations contain long SQL strings.
"migrations/**" = ["S608", "E501"]
# The fake SQL generator's job is to build SQL text from code constants (values are
# bound parameters); its output is untrusted and always validated by SqlGuard.
"src/hotel_agent/sql/generators.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "migrations", "scripts"]
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "db: test requires the local PostgreSQL container",
  "model: test requires the locally downloaded embedding model (never downloads)",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16.10",
]
